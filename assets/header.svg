<svg width="900" height="240" viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Anurag Behura, Software Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#bc8cff"/>
      <stop offset="1" stop-color="#ff7eb6"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>
  <style>
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 15px; }
    .sans { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
    .fade { animation: fade 1.2s ease-out both; }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <rect width="900" height="240" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="899" height="239" rx="17.5" fill="none" stroke="#30363d"/>
  <circle cx="760" cy="40" r="90" fill="#bc8cff" opacity="0.18" filter="url(#blur)"/>
  <circle cx="120" cy="230" r="90" fill="#58a6ff" opacity="0.16" filter="url(#blur)"/>

  <g class="fade">
    <text x="48" y="78" class="sans" font-size="14" font-weight="600" letter-spacing="4" fill="url(#accent)">SOFTWARE ENGINEER</text>
    <text x="48" y="140" class="sans" font-size="56" font-weight="700" fill="#ffffff">Anurag Behura</text>
    <rect x="50" y="158" width="120" height="4" rx="2" fill="url(#accent)"/>
    <text x="48" y="198" class="sans" font-size="20" fill="#8b949e">Java · Spring Boot · MySQL · Next.js</text>
  </g>

  <g class="fade">
    <rect x="550" y="38" width="310" height="164" rx="12" fill="#0d1117" stroke="#30363d"/>
    <circle cx="570" cy="58" r="5" fill="#ff5f56"/>
    <circle cx="588" cy="58" r="5" fill="#ffbd2e"/>
    <circle cx="606" cy="58" r="5" fill="#27c93f"/>
    <text x="570" y="96" class="mono" fill="#ff7b72">@SpringBootApplication</text>
    <text x="570" y="118" class="mono"><tspan fill="#ff7b72">class</tspan><tspan fill="#e6edf3"> </tspan><tspan fill="#d2a8ff">Anurag</tspan><tspan fill="#e6edf3"> {</tspan></text>
    <text x="570" y="140" class="mono"><tspan fill="#e6edf3">  api </tspan><tspan fill="#ff7b72">=</tspan><tspan fill="#a5d6ff"> "Spring Boot"</tspan><tspan fill="#e6edf3">;</tspan></text>
    <text x="570" y="162" class="mono"><tspan fill="#e6edf3">  db  </tspan><tspan fill="#ff7b72">=</tspan><tspan fill="#a5d6ff"> "MySQL"</tspan><tspan fill="#e6edf3">;</tspan></text>
    <text x="570" y="184" class="mono"><tspan fill="#e6edf3">}</tspan><tspan class="cursor" fill="#58a6ff"> ▌</tspan></text>
  </g>
</svg>
